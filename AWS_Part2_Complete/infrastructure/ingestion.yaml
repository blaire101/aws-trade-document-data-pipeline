AWSTemplateFormatVersion: '2010-09-09'
Description: Trade Data PipelineA ingestion - Scheduler, Step Functions, Fargate, Glue, CloudWatch and SNS.

Parameters:
  ProjectName:
    Type: String
    Default: trade-data
  FoundationStackName:
    Type: String
    Default: trade-data-foundation
  SftpHost:
    Type: String
  SftpSecretId:
    Type: String
  SftpRemoteDir:
    Type: String
    Default: /outbound/cinv
  DownloaderImageUri:
    Type: String
  GlueScriptS3Uri:
    Type: String
  GlueSqlBaseUri:
    Type: String
  ScheduleExpression:
    Type: String
    Default: rate(7 days)

Resources:
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub ${ProjectName}-database

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-cluster

  DownloaderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/downloader
      RetentionInDays: 14

  FargateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate downloader - outbound only
      VpcId:
        Fn::ImportValue: !Sub ${FoundationStackName}-VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  DownloaderTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RawS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:s3:::${Bucket}/raw/*
                    - Bucket:
                        Fn::ImportValue: !Sub ${FoundationStackName}-DataBucketName
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource:
                  Fn::ImportValue: !Sub ${FoundationStackName}-DataKeyArn
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: '*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-downloader
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt DownloaderTaskRole.Arn
      ContainerDefinitions:
        - Name: downloader
          Image: !Ref DownloaderImageUri
          Essential: true
          Environment:
            - Name: SFTP_HOST
              Value: !Ref SftpHost
            - Name: SFTP_SECRET_ID
              Value: !Ref SftpSecretId
            - Name: SFTP_REMOTE_DIR
              Value: !Ref SftpRemoteDir
            - Name: TARGET_BUCKET
              Value:
                Fn::ImportValue: !Sub ${FoundationStackName}-DataBucketName
            - Name: ARCHIVE_KEY
              Value: raw/archive/source.zip
            - Name: STAGED_PREFIX
              Value: raw/staged
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DownloaderLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: glue.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: TradeDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:s3:::${Bucket}
                    - Bucket:
                        Fn::ImportValue: !Sub ${FoundationStackName}-DataBucketName
                  - !Sub
                    - arn:${AWS::Partition}:s3:::${Bucket}/*
                    - Bucket:
                        Fn::ImportValue: !Sub ${FoundationStackName}-DataBucketName
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey]
                Resource:
                  Fn::ImportValue: !Sub ${FoundationStackName}-DataKeyArn

  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub ${ProjectName}-transform
      Role: !GetAtt GlueRole.Arn
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Ref GlueScriptS3Uri
      DefaultArguments:
        '--job-language': python
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-metrics': 'true'
        '--SOURCE_PATH': !Sub
          - s3://${Bucket}/raw/staged/
          - Bucket:
              Fn::ImportValue: !Sub ${FoundationStackName}-DataBucketName
        '--TARGET_PATH': !Sub
          - s3://${Bucket}/processed/
          - Bucket:
              Fn::ImportValue: !Sub ${FoundationStackName}-DataBucketName
        '--PROFILE_PATH': !Sub
          - s3://${Bucket}/profiling/
          - Bucket:
              Fn::ImportValue: !Sub ${FoundationStackName}-DataBucketName
        '--MANIFEST_PATH': !Sub
          - s3://${Bucket}/manifests/
          - Bucket:
              Fn::ImportValue: !Sub ${FoundationStackName}-DataBucketName
        '--DATABASE_NAME': !Ref GlueDatabase
        '--CLEANED_TABLE': trade_invoice_cleaned
        '--FAILED_TABLE': trade_invoice_failed
        '--REVIEW_TABLE': trade_invoice_review
        '--SQL_BASE_URI': !Ref GlueSqlBaseUri
        '--START_DATE': '2020-01-01'
        '--END_DATE': '2022-12-31'
        '--TARGET_DOCUMENT_TYPE': 'CINV'
        '--MIN_CATEGORY_FREQUENCY': '2'
        '--IQR_MULTIPLIER': '1.5'

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/${ProjectName}-ingestion
      RetentionInDays: 14

  FailureTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-ingestion-failure

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: states.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OrchestrateIngestion
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ecs:RunTask, ecs:StopTask, ecs:DescribeTasks]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt DownloaderTaskRole.Arn
              - Effect: Allow
                Action: [events:PutTargets, events:PutRule, events:DescribeRule]
                Resource: '*'
              - Effect: Allow
                Action: [glue:StartJobRun, glue:GetJobRun, glue:GetJobRuns, glue:BatchStopJobRun]
                Resource: '*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FailureTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  IngestionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${ProjectName}-ingestion
      RoleArn: !GetAtt StepFunctionsRole.Arn
      StateMachineType: STANDARD
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      DefinitionString: !Sub
        - |
          {
            "Comment": "Download ZIP, stage CSVs, then run Glue ETL",
            "StartAt": "RunDownloader",
            "States": {
              "RunDownloader": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::ecs:runTask.sync",
                "Parameters": {
                  "LaunchType": "FARGATE",
                  "Cluster": "${ClusterArn}",
                  "TaskDefinition": "${TaskDefinitionArn}",
                  "NetworkConfiguration": {
                    "AwsvpcConfiguration": {
                      "Subnets": ["${PrivateSubnetId}"],
                      "SecurityGroups": ["${SecurityGroupId}"],
                      "AssignPublicIp": "DISABLED"
                    }
                  }
                },
                "Retry": [{
                  "ErrorEquals": ["ECS.AmazonECSException", "States.Timeout", "States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 2,
                  "BackoffRate": 2.0
                }],
                "Catch": [{
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }],
                "Next": "RunGlueJob"
              },
              "RunGlueJob": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::glue:startJobRun.sync",
                "Parameters": {"JobName": "${GlueJobName}"},
                "Retry": [{
                  "ErrorEquals": ["Glue.AWSGlueException", "States.Timeout", "States.TaskFailed"],
                  "IntervalSeconds": 30,
                  "MaxAttempts": 2,
                  "BackoffRate": 2.0
                }],
                "Catch": [{
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }],
                "Next": "IngestionSucceeded"
              },
              "NotifyFailure": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {
                  "TopicArn": "${FailureTopicArn}",
                  "Message.$": "States.JsonToString($)"
                },
                "Next": "IngestionFailed"
              },
              "IngestionSucceeded": {"Type": "Succeed"},
              "IngestionFailed": {
                "Type": "Fail",
                "Error": "HDBIngestionFailed",
                "Cause": "Downloader or Glue failed. Review Step Functions and CloudWatch Logs."
              }
            }
          }
        - ClusterArn: !GetAtt ECSCluster.Arn
          TaskDefinitionArn: !Ref TaskDefinition
          PrivateSubnetId:
            Fn::ImportValue: !Sub ${FoundationStackName}-PrivateAppSubnetId
          SecurityGroupId: !Ref FargateSecurityGroup
          GlueJobName: !Ref GlueJob
          FailureTopicArn: !Ref FailureTopic

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref IngestionStateMachine

  DisabledSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-schedule
      Description: Disabled by default; enable after manual validation.
      FlexibleTimeWindow: {Mode: 'OFF'}
      ScheduleExpression: !Ref ScheduleExpression
      State: DISABLED
      Target:
        Arn: !Ref IngestionStateMachine
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{}'

Outputs:
  StateMachineArn:
    Value: !Ref IngestionStateMachine
  GlueDatabaseName:
    Value: !Ref GlueDatabase
  GlueJobName:
    Value: !Ref GlueJob
  ScheduleName:
    Value: !Ref DisabledSchedule
  FailureTopicArn:
    Value: !Ref FailureTopic
