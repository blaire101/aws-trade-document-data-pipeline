AWSTemplateFormatVersion: '2010-09-09'
Description: Analytics layer - private Tableau EC2, Athena VPC endpoint and Athena workgroup.

Parameters:
  ProjectName:
    Type: String
    Default: trade-data
  VpcId:
    Type: String
  PrivateAnalyticsSubnetId:
    Type: String
  DataBucketName:
    Type: String
  DataKeyArn:
    Type: String
  TableauAmiId:
    Type: AWS::EC2::Image::Id
  TableauInstanceType:
    Type: String
    Default: m6i.2xlarge
  PrivateAccessCidr:
    Type: String
    Default: 10.0.0.0/8

Resources:
  TableauSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Tableau access
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref PrivateAccessCidr
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  AthenaEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Athena endpoint accepts HTTPS from Tableau only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref TableauSecurityGroup

  AthenaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.athena
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateAnalyticsSubnetId]
      SecurityGroupIds: [!Ref AthenaEndpointSecurityGroup]

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub ${ProjectName}-analytics
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub s3://${DataBucketName}/athena-results/
          EncryptionConfiguration:
            EncryptionOption: SSE_KMS
            KmsKey: !Ref DataKeyArn

  TableauRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AthenaReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults, athena:StopQueryExecution, athena:GetWorkGroup]
                Resource: '*'
              - Effect: Allow
                Action: [glue:GetDatabase, glue:GetDatabases, glue:GetTable, glue:GetTables, glue:GetPartitions]
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:PutObject, s3:GetBucketLocation]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: !Ref DataKeyArn

  TableauInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref TableauRole]

  TableauInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref TableauAmiId
      InstanceType: !Ref TableauInstanceType
      SubnetId: !Ref PrivateAnalyticsSubnetId
      SecurityGroupIds: [!Ref TableauSecurityGroup]
      IamInstanceProfile: !Ref TableauInstanceProfile
      UserData:
        Fn::Base64: |
          #!/usr/bin/env bash
          set -e
          dnf update -y || yum update -y
          dnf install -y java-17-amazon-corretto-headless unzip curl || yum install -y java-17-amazon-corretto-headless unzip curl
          mkdir -p /opt/tableau/athena-jdbc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-tableau-private

Outputs:
  TableauInstanceId:
    Value: !Ref TableauInstance
  AthenaWorkGroup:
    Value: !Ref AthenaWorkGroup
  AthenaEndpointId:
    Value: !Ref AthenaEndpoint
